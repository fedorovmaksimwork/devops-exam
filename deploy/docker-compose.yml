name: devops-exam

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app1:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/app1-python:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_VERSION: ${IMAGE_TAG:-latest}
    labels:
      app: app1
    logging: *default-logging
    networks: [web]

  app2:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/app2-go:${IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      app: app2
    logging: *default-logging
    networks: [web]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app1, app2, grafana]
    labels:
      app: nginx
    logging: *default-logging
    networks: [web]

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [web]

  alloy:
    image: grafana/alloy:v1.7.1
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./logging/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [web]

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./logging/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki]
    networks: [web]

networks:
  web:

volumes:
  loki-data:
  grafana-data:
