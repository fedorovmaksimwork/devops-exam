server {
    listen 80;
    server_name _;

    location = / {
        default_type text/html;
        return 200 '<h3>DevOps exam</h3><ul><li><a href="/app1/">App 1 (Python)</a></li><li><a href="/app2/">App 2 (Go/gin)</a></li><li><a href="/grafana/">Grafana (logs)</a></li></ul>';
    }

    location /app1/ {
        proxy_pass http://app1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /app2/ {
        proxy_pass http://app2:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
    }
}
